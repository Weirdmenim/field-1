name: FieldOne Phase 10 Release Candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase10-release-candidate.yml'

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Install PostgreSQL client and browser runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run complete Phase 10 release-candidate gate
        env:
          PHASE10_SKIP_NPM_CI: '0'
        run: npm run phase10:release-candidate

      - name: Audit release evidence
        run: npm run phase11:evidence-audit

      - name: Upload Phase 10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldone-phase10-evidence
          path: .phase10-evidence
          if-no-files-found: warn
